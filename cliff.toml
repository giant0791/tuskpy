# git-cliff config (issue #7). Release flow:
#   git cliff --unreleased --tag vX.Y.Z --prepend CHANGELOG.md
# The header matches the CHANGELOG.md stub. Released sections stay frozen.

[changelog]
header = """
# Changelog

All notable changes to tuskpy. git-cliff writes each release section from the commits on `main`.
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor -%}
{% endfor -%}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# The HTML comments set the order of the groups.
commit_parsers = [
    { message = ".*", body = ".*BREAKING CHANGE", group = "<!-- 0 -->Breaking changes" },
    { message = "^[a-z]+(\\(.*\\))?!:", group = "<!-- 0 -->Breaking changes" },
    { message = "^feat", group = "<!-- 1 -->Added" },
    { message = "^fix", group = "<!-- 2 -->Fixed" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^revert", group = "<!-- 5 -->Reverted" },
    { message = ".*", skip = true },
]
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"

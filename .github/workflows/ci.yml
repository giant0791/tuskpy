# CI workflow. Design: issues #5 (jobs), #7 (pr-title, e2e), #10 (docs).
# `ci-ok` is the only required check. A new job joins `ci-ok`'s `needs`.
name: CI

on:
  pull_request:
    branches: [main]
    # `edited` runs pr-title again after a title change.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel old runs on a PR only. Every run on main completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.9"
  UV_LOCKED: "1"

jobs:
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check the PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            ci
            build
            chore
            revert

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Each feat PR adds or changes at least one e2e test (issue #7).
      - name: Check that a feat PR changes tests/e2e/
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^feat(\([^)]*\))?!?:'; then
            echo "Not a feat PR. No e2e test is required."
            exit 0
          fi
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -q '^tests/e2e/'; then
            echo "The feat PR changes tests/e2e/."
          else
            echo "::error::A feat PR must add or change a test in tests/e2e/."
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      # The same hooks as on the local machine, from one config.
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The requires-python floor and the newest stable release.
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      # Coverage config (branch, fail_under = 90) is in pyproject.toml.
      - run: uv run pytest --cov

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - name: Build the wheel
        run: uv build --wheel --out-dir dist
      # A clean environment: the wheel and the locked test tools only.
      # src/ is not on the path, so the tests use the installed package.
      - name: Install the wheel into a clean environment
        run: |
          uv export --only-group dev --no-emit-project --no-hashes \
            --format requirements.txt --output-file e2e-requirements.txt
          uv venv .venv-e2e
          uv pip install --python .venv-e2e/bin/python \
            -r e2e-requirements.txt dist/*.whl
      - name: Run the e2e tests
        run: .venv-e2e/bin/pytest -p no:cacheprovider tests/e2e

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --group docs
      # -W: every warning fails. --keep-going: one run shows all warnings.
      # -n: every cross-reference that does not resolve fails.
      - run: uv run sphinx-build -W --keep-going -n -b html docs docs/_build/html

  ci-ok:
    name: ci-ok
    if: always()
    needs: [pr-title, lint, test, e2e, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # A skipped job (pr-title on a push to main) counts as a pass.
      - name: Fail if a needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A needed job ended with '$result'."; exit 1 ;;
            esac
          done

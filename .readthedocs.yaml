# Read the Docs config (issue #10). RTD and the CI docs job use the same
# strictness, so a PR preview never shows a site that CI rejects.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    # RTD's native uv method installs the latest uv. `[tool.uv]
    # required-version` in pyproject.toml pins uv, so a new uv release
    # breaks `uv sync`. Pin uv here. Keep this version equal to
    # `required-version`.
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv 0.13.9
      - asdf global uv 0.13.9
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      # --locked: install from uv.lock, and fail if uv.lock is stale.
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" UV_LINK_MODE=copy uv sync --locked --group docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
